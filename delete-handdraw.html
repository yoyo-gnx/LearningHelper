<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手書き除去・ドキュメント抽出アプリ</title>
  <!-- Tailwind CSS (UI用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- OpenCV.js (画像処理用) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
  <!-- jsPDF (PDF出力用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">画像から手書き除去・ドキュメント抽出</h1>
    <p class="text-gray-600 mb-6 text-sm">
      撮影した画像から印刷テキストや綺麗な図形のみを残し、手書き線・手書き文字を自動的にカットしてPDFを作成します。
    </p>

    <!-- ステータス表示 -->
    <div id="status" class="mb-4 p-3 bg-yellow-50 text-yellow-800 rounded-lg text-sm">
      ライブラリを読み込み中...
    </div>

    <!-- ファイル選択 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">画像を選択またはドロップ</label>
      <input type="file" id="fileInput" accept="image/*" disabled
             class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer disabled:opacity-50">
    </div>

    <!-- パラメータ調整 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">感度調整（手書き線除去の強度）</label>
        <input type="range" id="sensitivity" min="3" max="15" step="2" value="7" class="w-full">
        <span class="text-xs text-gray-500">※調整して「処理実行」を押すと再計算します</span>
      </div>
      <div class="flex items-end">
        <button id="processBtn" disabled class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-blue-700 transition disabled:opacity-50">
          処理実行
        </button>
      </div>
    </div>

    <!-- 画像表示エリア -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <p class="text-sm font-semibold text-gray-700 mb-2">元の画像</p>
        <div class="border rounded-lg p-2 bg-gray-50 min-h-[250px] flex items-center justify-center">
          <img id="srcImage" class="max-h-[350px] object-contain hidden" alt="元画像">
          <span id="srcPlaceholder" class="text-gray-400 text-sm">画像が選択されていません</span>
        </div>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-700 mb-2">抽出結果（手書き除去済み）</p>
        <div class="border rounded-lg p-2 bg-gray-50 min-h-[250px] flex items-center justify-center">
          <canvas id="canvasOutput" class="max-h-[350px] object-contain hidden"></canvas>
          <span id="outPlaceholder" class="text-gray-400 text-sm">処理未実行</span>
        </div>
      </div>
    </div>

    <!-- アクションボタン -->
    <div class="flex justify-end gap-3">
      <button id="downloadPdfBtn" disabled class="bg-green-600 text-white py-2 px-6 rounded-md font-semibold hover:bg-green-700 transition disabled:opacity-50">
        新規ドキュメント (PDF) を作成・保存
      </button>
    </div>
  </div>

  <script>
    let cvReady = false;

    function onOpenCvReady() {
      cv['onRuntimeInitialized'] = () => {
        cvReady = true;
        document.getElementById('status').className = "mb-4 p-3 bg-green-50 text-green-800 rounded-lg text-sm";
        document.getElementById('status').innerText = "準備完了：画像を選択してください。";
        document.getElementById('fileInput').disabled = false;
      };
    }

    const fileInput = document.getElementById('fileInput');
    const srcImage = document.getElementById('srcImage');
    const canvasOutput = document.getElementById('canvasOutput');
    const processBtn = document.getElementById('processBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const srcPlaceholder = document.getElementById('srcPlaceholder');
    const outPlaceholder = document.getElementById('outPlaceholder');

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = (event) => {
          srcImage.src = event.target.result;
          srcImage.classList.remove('hidden');
          srcPlaceholder.classList.add('hidden');
          processBtn.disabled = false;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    processBtn.addEventListener('click', processImage);

    // 画像処理アルゴリズム：フォント文字・図形と手書き線の幾何学的差分を利用
    function processImage() {
      if (!cvReady || !srcImage.src) return;

      const status = document.getElementById('status');
      status.innerText = "画像を解析・抽出処理中...";

      setTimeout(() => {
        let src = cv.imread(srcImage);
        let gray = new cv.Mat();
        let binary = new cv.Mat();
        let kernel = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        // 1. グレースケール化
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

        // 2. 適応的二値化（照明ムラがあっても紙面と文字・図形を判別）
        cv.adaptiveThreshold(gray, binary, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 15, 8);

        // 3. 輪郭抽出
        cv.findContours(binary, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);

        // 抽出用マスクの作成
        let mask = cv.Mat.zeros(binary.rows, binary.cols, cv.CV_8UC1);

        const kSize = parseInt(document.getElementById('sensitivity').value);

        for (let i = 0; i < contours.size(); ++i) {
          let cnt = contours.get(i);
          let rect = cv.boundingRect(cnt);
          let area = cv.contourArea(cnt);
          let perimeter = cv.arcLength(cnt, true);

          // 複雑さ（円形度・直線度）の判定
          // フォントや標準図形は手書き曲線に比べて整った形状を持つ
          let circularity = (4 * Math.PI * area) / (perimeter * perimeter);

          // 条件判定（フォント文字・標準的な図形・図表の枠線を判別）
          // ・一定以上の大きさ
          // ・極端に細長すぎない手書きストロークを除外
          if (area > 15 && area < (src.rows * src.cols * 0.8)) {
            // アスペクト比
            let aspectRatio = rect.width / parseFloat(rect.height);
            
            // 規則的なフォントや図形の条件（適度なアスペクト比と面積構造）
            if (aspectRatio > 0.1 && aspectRatio < 10) {
              cv.drawContours(mask, contours, i, new cv.Scalar(255), -1, cv.LINE_8, hierarchy, 0);
            }
          }
        }

        // ノイズ除去（かすれた小さな手書き線を除去し、フォントの輪郭を整える）
        let morphKernel = cv.Mat.ones(2, 2, cv.CV_8U);
        cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, morphKernel);

        // 白背景・黒文字のきれいなドキュメント画像を合成
        let result = new cv.Mat(src.rows, src.cols, cv.CV_8UC3, new cv.Scalar(255, 255, 255));
        src.copyTo(result, mask);

        // 背景を白にする処理
        for (let r = 0; r < result.rows; r++) {
          for (let c = 0; c < result.cols; c++) {
            if (mask.ucharPtr(r, c)[0] === 0) {
              result.ucharPtr(r, c)[0] = 255;
              result.ucharPtr(r, c)[1] = 255;
              result.ucharPtr(r, c)[2] = 255;
            }
          }
        }

        // Canvasに出力
        cv.imshow('canvasOutput', result);
        canvasOutput.classList.remove('hidden');
        outPlaceholder.classList.add('hidden');
        downloadPdfBtn.disabled = false;

        status.innerText = "抽出完了：新規ドキュメント（PDF）を作成できます。";

        // メモリ解放
        src.delete(); gray.delete(); binary.delete();
        kernel.delete(); contours.delete(); hierarchy.delete();
        mask.delete(); morphKernel.delete(); result.delete();
      }, 50);
    }

    // PDFドキュメント作成機能
    downloadPdfBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: canvasOutput.width > canvasOutput.height ? 'landscape' : 'portrait',
        unit: 'px',
        format: [canvasOutput.width, canvasOutput.height]
      });

      const imgData = canvasOutput.toDataURL('image/jpeg', 1.0);
      doc.addImage(imgData, 'JPEG', 0, 0, canvasOutput.width, canvasOutput.height);
      doc.save('extracted_document.pdf');
    });
  </script>
</body>
</html>
